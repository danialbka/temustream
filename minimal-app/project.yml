name: StremioSkeleton
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "16.0"
    tvOS: "18.0"
    watchOS: "10.0"
packages:
  KSPlayer:
    # Pinned from upstream revision 25c923b. The local package carries narrowly
    # scoped timestamp-seek and display-cadence fixes for real device playback.
    path: Vendor/KSPlayer
  FFmpegKit:
    # Bunny links the pinned libav products directly. KSPlayer remains an
    # independent selectable player; Bunny does not instantiate or wrap it.
    url: https://github.com/kingslay/FFmpegKit.git
    exactVersion: 6.1.4
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift.git
    exactVersion: 0.8.1
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.16.0
targets:
  StremioSkeleton:
    type: application
    platform: iOS
    sources:
      - Sources/StremioSkeletonCore
      - iOS/App
      - path: iOS/Resources/Assets.xcassets
        buildPhase: resources
      - path: iOS/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: iOS/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "21"
        CFBundleDisplayName: TemuStremio
        StremioSourceIdentity: $(STREMIO_SOURCE_ID)
        WatchTogetherConvexURL: $(WATCH_TOGETHER_CONVEX_URL)
        WatchTogetherLiveKitURL: $(WATCH_TOGETHER_LIVEKIT_URL)
        NSMicrophoneUsageDescription: TemuStremio uses your microphone only when you enable voice chat in a Watch Together room.
        NSLocalNetworkUsageDescription: TemuStremio connects to streaming servers on your local network when you configure one for playback.
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: iOS/Resources/StremioSkeleton.entitlements
      properties: {}
    dependencies:
      - package: ConvexMobile
      - package: LiveKit
      - package: KSPlayer
      - package: FFmpegKit
        product: Libavcodec
      - package: FFmpegKit
        product: Libavformat
      - package: FFmpegKit
        product: Libavutil
      - package: FFmpegKit
        product: Libswresample
      - package: FFmpegKit
        product: Libswscale
      - framework: build/dependencies/MobileVLCKit.xcframework
        embed: true
        codeSign: true
      - framework: build/dependencies/StremioPlaybackCore.xcframework
        embed: false
    configFiles:
      Debug: config/WatchTogether.xcconfig
      Release: config/WatchTogether.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stremio.skeleton
        PRODUCT_NAME: StremioSkeleton
        SWIFT_VERSION: 6.0
        SWIFT_OPTIMIZATION_LEVEL: -O
        SWIFT_COMPILATION_MODE: wholemodule
        SWIFT_OBJC_BRIDGING_HEADER: iOS/App/StremioSkeleton-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/rust/StremioPlaybackCore/include
        ASSETCATALOG_COMPILER_APPICON_NAME: TemuStremioAppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        STREMIO_SOURCE_ID: unverified
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  StremioSkeletonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - iOS/UITests
    dependencies:
      - target: StremioSkeleton
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stremio.skeleton.uitests
        PRODUCT_NAME: StremioSkeletonUITests
        TEST_TARGET_NAME: StremioSkeleton
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  TemuStreamTV:
    type: application
    platform: tvOS
    sources:
      - Sources/StremioSkeletonCore
      - iOS/App/AppModel.swift
      - iOS/App/SessionStore.swift
      - iOS/App/TorBoxPlaybackResolver.swift
      - tvOS/App
      - path: tvOS/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: tvOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: TemuStremio
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "18"
        StremioSourceIdentity: $(STREMIO_SOURCE_ID)
        NSLocalNetworkUsageDescription: TemuStremio connects to streaming servers on your local network when you configure one for playback.
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stremio.skeleton.tv
        PRODUCT_NAME: TemuStreamTV
        SWIFT_VERSION: 6.0
        SWIFT_OPTIMIZATION_LEVEL: -O
        SWIFT_COMPILATION_MODE: wholemodule
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        STREMIO_SOURCE_ID: unverified
        ASSETCATALOG_COMPILER_APPICON_NAME: TemuStremioTVAppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  TemuStreamTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - tvOS/UITests
    dependencies:
      - target: TemuStreamTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stremio.skeleton.tv.uitests
        PRODUCT_NAME: TemuStreamTVUITests
        TEST_TARGET_NAME: TemuStreamTV
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  TemuStremioWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Sources/StremioSkeletonCore/Models.swift
      - Sources/StremioSkeletonCore/IntroSkipPolicy.swift
      - Sources/StremioSkeletonCore/AddonEndpoint.swift
      - Sources/StremioSkeletonCore/AddonClient.swift
      - Sources/StremioSkeletonCore/TorrentStreamingClient.swift
      - Sources/StremioSkeletonCore/StremioAccountClient.swift
      - Sources/StremioSkeletonCore/LibraryStore.swift
      - Sources/StremioSkeletonCore/PlaybackProgressStore.swift
      - Sources/StremioSkeletonCore/PlaybackCompletionStore.swift
      - Sources/StremioSkeletonCore/ViewingProfiles.swift
      - Sources/StremioSkeletonCore/DiscoveryPresentation.swift
      - Sources/StremioSkeletonCore/CatalogPaging.swift
      - Sources/StremioSkeletonCore/LocalRecommendations.swift
      - Sources/StremioSkeletonCore/EpisodeResumeSelection.swift
      - Sources/StremioSkeletonCore/PlaybackPreferences.swift
      - Sources/StremioSkeletonCore/LastSuccessfulPlayback.swift
      - Sources/StremioSkeletonCore/TitleTrivia.swift
      - Sources/StremioSkeletonCore/WikipediaTrivia.swift
      - Sources/StremioSkeletonCore/MediaContainerSniffer.swift
      - Sources/StremioSkeletonCore/TorBoxStreamSelection.swift
      - Sources/StremioSkeletonCore/WatchStreamCompatibility.swift
      - Sources/StremioSkeletonCore/WatchPlaybackFallback.swift
      - iOS/App/TorBoxPlaybackResolver.swift
      - watchOS/App
      - path: iOS/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: watchOS/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: watchOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: TemuStremio
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "21"
        WKApplication: true
        WKWatchOnly: true
        WKPrefersNetworkUponForeground: true
        NSLocalNetworkUsageDescription: TemuStremio connects to a streaming server on your local network only when you configure one for playback.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stremio.skeleton.watch.watchkitapp
        PRODUCT_NAME: TemuStremioWatch
        SWIFT_VERSION: 6.0
        SWIFT_OPTIMIZATION_LEVEL: -O
        SWIFT_COMPILATION_MODE: wholemodule
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: TemuStremioWatchAppIcon
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  TemuStremioWatchContainer:
    type: application.watchapp2-container
    platform: iOS
    sources: []
    info:
      path: watchOS/Container/Info.plist
      properties:
        CFBundleDisplayName: TemuStremio
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "21"
        LSApplicationLaunchProhibited: true
    dependencies:
      - target: TemuStremioWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stremio.skeleton.watch
        PRODUCT_NAME: TemuStremioWatchContainer
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  StremioSkeleton:
    build:
      targets:
        StremioSkeleton: all
        StremioSkeletonUITests: [test]
    test:
      config: Debug
      targets:
        - StremioSkeletonUITests
    run:
      config: Release
    archive:
      config: Release
  TemuStreamTV:
    build:
      targets:
        TemuStreamTV: all
        TemuStreamTVUITests: [test]
    test:
      config: Debug
      targets:
        - TemuStreamTVUITests
    run:
      config: Release
    archive:
      config: Release
  TemuStremioWatch:
    build:
      targets:
        TemuStremioWatch: [run, test, profile, analyze]
    run:
      config: Debug
      executable: TemuStremioWatch
  TemuStremioWatchDistribution:
    build:
      targets:
        TemuStremioWatchContainer: [archive]
    archive:
      config: Release
      customArchiveName: TemuStremioWatch
