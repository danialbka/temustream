name: StremioSkeleton
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "16.0"
packages:
  KSPlayer:
    # Pinned from upstream revision 25c923b. The local package carries narrowly
    # scoped timestamp-seek and display-cadence fixes for real device playback.
    path: Vendor/KSPlayer
targets:
  StremioSkeleton:
    type: application
    platform: iOS
    sources:
      - Sources/StremioSkeletonCore
      - iOS/App
    info:
      path: iOS/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: iOS/Resources/StremioSkeleton.entitlements
      properties:
        com.apple.developer.group-session: true
    dependencies:
      - package: KSPlayer
      - framework: build/dependencies/MobileVLCKit.xcframework
        embed: true
        codeSign: true
      - framework: build/dependencies/StremioPlaybackCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.stremio.skeleton
        PRODUCT_NAME: StremioSkeleton
        SWIFT_VERSION: 6.0
        SWIFT_OPTIMIZATION_LEVEL: -O
        SWIFT_COMPILATION_MODE: wholemodule
        SWIFT_OBJC_BRIDGING_HEADER: iOS/App/StremioSkeleton-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/rust/StremioPlaybackCore/include
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  StremioSkeleton:
    build:
      targets:
        StremioSkeleton: all
    run:
      config: Release
    archive:
      config: Release
