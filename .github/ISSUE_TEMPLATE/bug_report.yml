name: Bug report
description: Report a reproducible TemuStremio problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use lawful test media and remove credentials, private URLs, device identifiers, and personal data. Security issues belong in the private reporting route in SECURITY.md.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone or iPad
        - Apple TV
        - Apple Watch
        - Swift package or backend
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: 1.3 (21) or a commit SHA
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and device model
      placeholder: watchOS version and Apple Watch model
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the selected player and source type, but redact private provider details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add a short log excerpt or screenshot only after checking it for private data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, tokens, private URLs, device identifiers, and personal data.
          required: true
